

<!-- templates/auth/register.html -->
{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="form-container card">
    <h2>Create a New Account</h2>
    <form method="POST" action="{{ url_for('auth.register') }}">
        {% if not show_otp %}
            <input type="hidden" name="step" value="send_otp">
            <!-- Fields for Name, Email, Password, Role -->
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" value="{{ form_data.name or '' }}" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" value="{{ form_data.email or '' }}" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="role">I am a...</label>
                <select id="role" name="role" required onchange="toggleRoleFields()">
                    <option value="">Select Role</option>
                    <option value="Donor" {% if form_data.role == 'Donor' %}selected{% endif %}>Donor</option>
                    <option value="NGO" {% if form_data.role == 'NGO' %}selected{% endif %}>NGO</option>
                    <option value="Medical Store" {% if form_data.role == 'Medical Store' %}selected{% endif %}>Medical Store</option>
                </select>
            </div>
            
            <!-- Role-specific fields -->
            <div id="ngo_fields" style="display:none;">
                <input type="text" name="ngo_contact" placeholder="NGO Contact Number">
                <input type="text" name="ngo_address" placeholder="NGO Address">
                <input type="text" name="registration_number" placeholder="NGO Registration Number">
            </div>
            <div id="ms_fields" style="display:none;">
                 <input type="text" name="ms_contact" placeholder="Store Contact Number">
                <input type="text" name="ms_address" placeholder="Store Address">
            </div>

            <button type="submit" class="btn-primary">Send OTP</button>
        {% else %}
            <input type="hidden" name="step" value="verify_otp">
            <p>An OTP has been sent to <strong>{{ email }}</strong>. Please enter it below.</p>
            <div class="form-group">
                <label for="otp">OTP</label>
                <input type="text" id="otp" name="otp" required>
            </div>
            <button type="submit" class="btn-primary">Verify OTP & Register</button>
        {% endif %}
    </form>
</div>
<script>
function toggleRoleFields() {
    const role = document.getElementById('role').value;
    document.getElementById('ngo_fields').style.display = role === 'NGO' ? 'block' : 'none';
    document.getElementById('ms_fields').style.display = role === 'Medical Store' ? 'block' : 'none';
}
// Initial call in case the page reloads with a role selected
toggleRoleFields();
</script>
{% endblock %}
